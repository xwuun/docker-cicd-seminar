services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://seminar:seminar-local@db:5432/seminar
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/db', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 10s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seminar
      POSTGRES_PASSWORD: seminar-local
      POSTGRES_DB: seminar
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seminar -d seminar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data: